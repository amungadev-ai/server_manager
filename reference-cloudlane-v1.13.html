/* Cloudlane v1.3: additive registry management styles, same v1.1 visual system. */
.domain-zone-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.domain-zone-card{display:flex;flex-direction:column;min-height:252px;gap:13px}
.zone-name{font-size:20px;letter-spacing:-.4px;margin:4px 0 -5px;overflow-wrap:anywhere}
.domain-zone-card p{margin:0;min-height:34px}
.domain-zone-card .btn{margin-top:auto;align-self:flex-start}
.zone-foot{display:flex;gap:25px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.zone-foot strong{font-size:16px}
.domain-tabs{margin-top:12px;margin-bottom:23px}
.host-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);min-width:0}
.host-row:last-child{border-bottom:none}
.host-row .mono,.dns-value{overflow-wrap:anywhere;word-break:break-word}
.readiness-list{display:grid;gap:14px;margin:18px 0;font-size:12px}
.readiness-list>div{display:flex;gap:12px;align-items:center;color:var(--muted)}
.readiness-list svg{color:var(--mint)}
.subdomain-pair{display:flex;align-items:center;gap:10px}
.subdomain-pair input{flex:1;min-width:0}
.subdomain-pair span{max-width:45%;overflow-wrap:anywhere}
.inbox-demo{display:grid;gap:10px;margin-top:17px}
.inbox-message{border:1px solid var(--border);border-radius:10px;padding:14px;display:grid;gap:5px}
.inbox-message p{margin:0;color:var(--muted);font-size:12px}
@media(max-width:1100px){.domain-zone-grid{grid-template-columns:1fr}}
@media(max-width:600px){.domain-zone-grid{grid-template-columns:1fr}.host-row{flex-wrap:wrap}.subdomain-pair{flex-wrap:wrap}.subdomain-pair span{max-width:100%}.domain-tabs{gap:0}.domain-tabs .tab{padding-inline:11px}}

[hidden]{display:none!important}
.privilege-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 16px;max-height:290px;overflow-y:auto;padding:4px}
.privilege-item{padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--panel2);font-size:12px}
@media(max-width:570px){.privilege-grid{grid-template-columns:1fr}}

/* Cloudlane v1.5: original Cloudlane visuals; focused navigation + architecture + assistant */
.nav-group-title{font-size:10px;letter-spacing:.13em;color:var(--dim);font-weight:800;margin:17px 12px 8px;text-transform:uppercase}
.nav-group-title:first-child{margin-top:4px}

:root{
  /* Existing Cloudlane semantic names resolve to the design system. */
  --panel:var(--raised);--panel2:var(--overlay);--panel3:var(--sunken);
  --border2:var(--border-default);--dim:var(--muted);
  --mint:var(--primary);--mintbg:var(--primary-tint);
  --blue:var(--info);--bluebg:var(--info-bg);
  --yellow:var(--warning);--yellowbg:var(--warning-bg);
  --red:var(--danger);--redbg:var(--danger-bg);
  --radius:8px;--shadow:var(--shadow-md);
}
html{scroll-behavior:smooth}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;color:var(--secondary);background:var(--bg);font-synthesis:none}
:focus-visible{outline:2px solid var(--focus-ring,#14b8a6);outline-offset:3px}
input,select,textarea{background:var(--overlay);color:var(--text);border:1px solid var(--border-default);border-radius:6px;min-height:40px;padding:10px 12px;box-shadow:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-tint)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);min-height:0}
option{background:var(--overlay);color:var(--text)}
.mono,code,pre,.codebox,.tiny-code,.token-preview,.docs-code,.term-screen,.term-command input,.term-command label,.term-command-chip,.sql-editor,.sql-result{font-family:"JetBrains Mono","Fira Code",Menlo,monospace}
.stat-number,.store-kpi strong{font-variant-numeric:tabular-nums}
/* Preserve Cloudlane brand and its existing navigation groups. */
.sidebar{width:256px;min-width:256px;background:var(--raised);border-color:var(--border);overflow:hidden}
.brand{height:78px;min-height:78px;padding:0 24px;border-color:var(--border)}
.brand-name{font-size:19px;font-weight:700;letter-spacing:-.04em;color:var(--text)}
.brand-tag{font-size:9px;font-weight:600;letter-spacing:.16em;color:var(--muted)}
.logo{border-radius:8px;box-shadow:none}
.workspace-btn{margin:4px 12px 18px;padding:10px;border-radius:8px;background:var(--raised);border-color:var(--border)}
.workspace-ico{border-radius:6px;background:var(--primary-tint);color:var(--primary)}
.nav-list{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;align-content:start;padding:0 12px}
.nav-group-title,.sidebar-label{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin:15px 12px 6px}
.nav-group-title:first-child{margin-top:4px}
.nav-item{padding:10px 12px;border-radius:6px;color:var(--secondary);font-weight:500;margin:2px 0}

.sidebar-bottom{flex-shrink:0;margin-top:0;padding:14px 12px;border-color:var(--border);background:var(--raised)}
.side-small-link{border-radius:6px;color:var(--secondary);background:transparent}
.side-small-link:hover{background:var(--sunken)}
.avatar{background:var(--palette-button,#0d9488);color:var(--palette-button-text,#fff)}
.profile-name{color:var(--text)}
.main{margin-left:256px;width:calc(100% - 256px)}
.topbar{height:64px;min-height:64px;padding:0 32px;background:var(--bg);backdrop-filter:none;border-color:var(--border)}
.top-pill{color:var(--warning);background:var(--warning-bg);border:1px solid var(--border);border-radius:5px;font-size:11px;font-weight:600;letter-spacing:0}
.top-server{color:var(--muted)}

.content{max-width:1600px;padding:32px 40px 72px}
.heading{margin-bottom:28px}

.btn-danger{background:transparent;border-color:var(--border-default);color:var(--danger)}

.btn-small{min-height:32px;padding:6px 10px;font-size:12px;font-weight:600}
.icon-btn{width:36px;height:36px;border:0;background:transparent;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--sunken);color:var(--text)}
.card{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:24px;box-shadow:var(--shadow)}
.card-plain{background:var(--raised);border-color:var(--border);border-radius:8px}
.grid{gap:16px}.two,.two-wide{column-gap:20px}.stat{padding:24px}
.stat .stat-icon{width:42px;height:42px;border:1px solid var(--border);border-radius:8px;background:var(--overlay);color:var(--primary)}

.tag{font-size:12px;line-height:18px;font-weight:500;padding:4px 8px;border-radius:5px;background:var(--sunken);border:0;color:var(--muted)}
.tag.ok{color:var(--success);background:var(--success-bg)}
.tag.warn{color:var(--warning);background:var(--warning-bg)}
.tag.fail{color:var(--danger);background:var(--danger-bg)}
.tag.blue{color:var(--info);background:var(--info-bg)}
.tag.violet{color:var(--primary);background:var(--primary-tint)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.status-icon{border-color:var(--border);background:var(--overlay);border-radius:8px;color:var(--info)}
.status-icon.mint{color:var(--primary);background:var(--primary-tint);border-color:var(--border)}
.status-icon.gold{color:var(--warning);background:var(--warning-bg);border-color:var(--border)}
.status-icon.purple{color:var(--info);background:var(--info-bg);border-color:var(--border)}
.clickable:hover,.project-card:hover{background:var(--overlay);border-color:var(--primary)}
.project-card{padding:22px;gap:16px}.project-card h3{font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.divider{background:var(--border)}
.table{font-size:13px}
.table th{background:var(--sunken);color:var(--muted);font-size:11px;line-height:16.5px;font-weight:600;text-transform:uppercase;letter-spacing:.055em;padding:12px 16px;border-bottom:1px solid var(--border)}
.table td{padding:16px;border-bottom:1px solid var(--border)}
.table tbody tr:hover{background:var(--sunken)}
.table td .main-cell{color:var(--text);font-weight:600}
.table td .sub-cell{color:var(--muted)}
.link,.file-crumb button{color:var(--primary);font-weight:600}
.empty{padding:42px 16px}
.activity-item{border-color:var(--border)}
.activity-icon{background:var(--sunken);color:var(--primary)}
.activity-text{color:var(--text)}.activity-time{color:var(--muted)}
.soft-banner,.storage-privacy{background:var(--raised);color:var(--secondary);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:6px;padding:14px 16px}
.soft-banner p,.storage-privacy p{color:var(--muted)}
.storage-privacy .icon{color:var(--primary)}
.storage-privacy strong{color:var(--text)}
.progress{height:5px;background:var(--sunken)}.progress>span{background:var(--primary)}
.metric{border-radius:8px}.metric-value{color:var(--text)}
.tabs{gap:24px;margin:15px 0 24px}.tab{padding:0 0 12px;font-size:13px;font-weight:500;color:var(--muted)}
.tab:hover{color:var(--text)}.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.back{color:var(--muted)}.back:hover{color:var(--primary)}
.kv{font-size:13px}.kv .v{color:var(--text)}
.notice{color:var(--warning);background:var(--warning-bg);border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:6px}
.hint{color:var(--muted)}
.step-marker{background:var(--sunken);border-color:var(--border-default);color:var(--muted)}
.step:not(:last-child) .step-marker::after{background:var(--border-strong)}
.step-marker.completed{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.step-marker.current{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.step-marker.failed{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.callout{background:var(--raised);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:6px;padding:14px 16px}
.callout-title{color:var(--text)}
.form-label{font-size:14px;font-weight:500;color:var(--text);margin-bottom:7px}.form-sub{color:var(--muted)}
.form-check{color:var(--secondary)}
.modal-wrap{background:rgb(2 6 23 / .55);backdrop-filter:none}
.modal{width:min(650px,100%);background:var(--overlay);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);animation:none}

.modal-body{padding:24px}.modal-footer{padding:16px 24px;border-color:var(--border)}
.tile-option,.dns-mode-choice{border-color:var(--border-default);border-radius:8px;background:var(--raised);color:var(--text);padding:18px}
.tile-option:hover,.dns-mode-choice:hover{border-color:var(--primary);background:var(--primary-tint)}
.tile-option span{color:var(--muted)}
.dropzone{background:var(--raised);border:2px dashed var(--border-default);border-radius:8px;padding:32px 16px}
.dropzone:hover,.dropzone.drag{background:var(--primary-tint);border-color:var(--primary)}
.toast{background:var(--overlay);color:var(--text);border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--shadow-md);font-size:13px}
.toast.error-toast{color:var(--danger);background:var(--danger-bg);border-color:var(--border)}
.search input{background:var(--overlay)}.search svg{color:var(--muted)}
.quicklink{border-radius:8px;background:var(--raised);color:var(--text)}.quicklink:hover{background:var(--sunken)}
.store-card:hover,.file-folder:hover{background:var(--overlay);border-color:var(--primary)}
.file-row{border-color:var(--border)}
.safety-unit{border-radius:8px;background:var(--raised)}
.storage-pill{color:var(--muted)}
.storage-tip,.ai-safety{background:var(--primary-tint);border:1px solid var(--border);border-left:3px solid var(--primary);color:var(--secondary);border-radius:6px}
.demo-badge{color:var(--warning);background:var(--warning-bg);border-color:var(--border);border-radius:5px}
.tiny-code,.token-preview{background:var(--sunken);border-color:var(--border);color:var(--text)}
.access-scope{color:var(--secondary);background:var(--sunken)}
.dns-mode-choice:has(input:checked){border-color:var(--primary);background:var(--primary-tint);box-shadow:none}
.dns-mode-choice[style*="background:#142d2d"]{background:var(--primary-tint)!important;border-color:var(--primary)!important}
.dns-mini-panel{background:var(--overlay);border-radius:8px}
.dns-step-index{background:var(--sunken);color:var(--primary)}
.arch-node,.arch-link{background:var(--overlay);border-color:var(--border);border-radius:8px}
.arch-node .arch-url{color:var(--primary)}
.ai-fab{background:var(--palette-button,#0d9488);color:var(--palette-button-text,#fff);border:0;border-radius:6px;box-shadow:var(--shadow-md);font-weight:600}
.ai-fab:hover{background:var(--primary-hover)}
.ai-overlay{background:rgb(2 6 23 / .55)}
.ai-drawer{background:var(--raised);border-color:var(--border);box-shadow:var(--shadow-md)}
.ai-drawer-head{border-color:var(--border)}
.ai-sample{background:var(--overlay);border-color:var(--border);border-radius:8px;color:var(--text)}
.ai-sample:hover{border-color:var(--primary)}
.ai-plan-step{border-color:var(--border)}
.ai-step-no{background:var(--sunken);color:var(--muted)}
.ai-plan-step.done .ai-step-no{background:var(--success-bg);color:var(--success)}
.term-banner{background:var(--info-bg);border-color:var(--border);color:var(--secondary);border-radius:8px}
.term-banner svg{color:var(--info)}
.term-two,.sql-cards{gap:20px}
.term-console{border-color:var(--border);border-radius:8px}
/* Dark terminal/code surfaces remain intentionally dark in light mode for readability. */
.term-screen,.codebox,.docs-code{font-family:"JetBrains Mono","Fira Code",Menlo,monospace}
.side-small-link,.dns-mode-choice{box-shadow:none}
/* Appearance controls — visual preferences only, in existing Settings > Preferences. */
.design-pref-panel{margin-bottom:20px}
.design-pref-panel .design-intro{color:var(--muted);font-size:13px;margin:5px 0 20px}
.design-pref-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.design-pref-group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:16px 0 10px}
.design-mode-group{display:inline-flex;gap:6px;padding:4px;border-radius:8px;background:var(--sunken);border:1px solid var(--border)}
.design-mode-group button{border:1px solid transparent;border-radius:6px;background:transparent;color:var(--secondary);padding:8px 16px;font-weight:600;font-size:13px;min-width:98px;cursor:pointer}
.design-mode-group button[aria-pressed="true"]{background:var(--overlay);color:var(--text);border-color:var(--border-default);box-shadow:var(--shadow)}
.design-palette-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.design-palette-choice{display:flex;flex-direction:column;gap:9px;min-width:0;text-align:left;border:1px solid var(--border-default);border-radius:8px;background:var(--bg);color:var(--text);padding:9px;cursor:pointer}
.design-palette-choice:hover{border-color:var(--primary)}
.design-palette-choice[aria-pressed="true"]{outline:2px solid var(--focus-ring,var(--primary));outline-offset:1px}
.design-palette-choice strong{font-size:11px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.design-swatch{height:34px;width:100%;display:block;border-radius:4px;border:1px solid var(--border)}
.design-swatch.original{background:linear-gradient(to right,#020617 0 33.33%,#0d9488 33.33% 66.66%,#f1f5f9 66.66%)}
.design-swatch.slate{background:linear-gradient(to right,#d3d3d3 0 50%,#333333 50%)}
.design-swatch.sand{background:linear-gradient(to right,#f7e1c7 0 50%,#8b4513 50%)}
.design-swatch.sage{background:linear-gradient(to right,#a8b8a3 0 50%,#65000b 50%)}
.design-swatch.mauve{background:linear-gradient(to right,#ccaeb5 0 33.33%,#88963d 33.33% 66.66%,#110f19 66.66%)}

/* Cloudlane v1.12 · quiet mobile metrics and small movable Assistant launcher. */
.ai-fab,
.ai-fab:hover {
  width:42px;
  height:42px;
  min-width:42px;
  min-height:42px;
  padding:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  gap:0;
  right:18px;
  bottom:18px;
  box-shadow:0 4px 18px rgb(0 0 0 / .20);
  touch-action:none;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.ai-fab:active{cursor:grabbing;transform:none}
.ai-fab svg{width:18px;height:18px;pointer-events:none}
.ai-fab:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
@media(max-width:650px){

  .grid.four .stat .stat-icon svg{height:15px;width:15px}
  .grid.four .stat-number{order:1;margin:0;padding:0;min-width:26px;font-size:21px;line-height:1.1;font-weight:650;letter-spacing:-.5px;color:var(--secondary)}
  .grid.four .stat-main{order:2;gap:1px}
  .grid.four .stat-label{font-size:12px;line-height:1.3;font-weight:650}
  .grid.four .stat-note{font-size:10px;line-height:1.3}
  .ai-fab,.ai-fab:hover{width:40px;height:40px;min-width:40px;min-height:40px;bottom:15px;right:15px}
}
@media(prefers-reduced-motion:reduce){.ai-fab{transition:none!important}}


/* Cloudlane v1.13 — platform-wide hierarchy and density refinement.
   Intentionally retains v1.12 components, interactions, palette tokens and content. */
:root{--cl-space-xs:6px;--cl-space-sm:10px;--cl-space-md:14px;--cl-space-lg:20px;--cl-control-radius:6px}
.content{padding-top:28px}

.heading h1{font-size:32px;line-height:1.22;letter-spacing:-.045em;margin-bottom:6px}

.section-head{margin:24px 0 12px;align-items:center}
.section-title{font-size:18px;line-height:1.35;font-weight:650;letter-spacing:-.025em}
.card .section-title{font-size:16px;line-height:1.4}
.card{padding:20px}
.grid{gap:14px}
.two,.two-wide{gap:16px}
.btn{min-height:38px;padding:8px 13px;gap:7px;font-size:13px}
.btn-small{min-height:30px;padding:5px 9px;font-size:11px}
.nav-item{padding:8px 10px;margin:1px 0;gap:10px;min-height:35px}
.nav-group-title{margin:13px 10px 5px}
.nav-list{padding:0 10px}
.sidebar-bottom{padding:11px 12px}
.side-small-link{margin-top:2px;padding:9px 10px}
.table th{padding:10px 14px}
.table td{padding:12px 14px}
.table-frame{padding:0}
.table .main-cell{line-height:1.35}
.table .sub-cell{line-height:1.3}
.host-row{padding:10px 0}
.divider{margin:13px 0}
.soft-banner,.storage-privacy{padding:12px 14px}
.soft-banner p,.storage-privacy p{font-size:12px;line-height:1.55}
.quicklink{padding:12px 13px;min-height:68px}
.activity-item{padding:9px 0}
.search{max-width:330px}
.search input{min-height:38px}
.tabs{margin-top:13px;margin-bottom:20px}
.tab{padding-bottom:10px}
.arch-map{gap:13px}

.setting-grid{gap:14px}

/* Compact project gallery — one clear reading path per card. */
.project-card{display:grid;grid-template-columns:38px minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:11px;row-gap:0;min-height:106px;padding:16px 16px 14px;position:relative;cursor:pointer}
.project-card .project-mark{grid-row:1 / 3;grid-column:1;width:36px;height:36px;display:grid;place-items:center;color:var(--primary);background:var(--primary-tint);border:1px solid var(--border);border-radius:8px;align-self:start}
.project-card .project-copy{grid-row:1 / 3;grid-column:2;min-width:0;align-self:start;padding-top:1px}
.project-card h3{font-size:14px;line-height:1.35;font-weight:650;margin:0 0 5px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;color:var(--text)}
.project-card .project-desc{font-size:11px;line-height:1.4;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-card .project-meta-separator{padding:0 3px;color:var(--border-strong)}
.project-card .project-health{display:inline-flex;align-items:center;gap:4px}
.project-card .project-health-dot{width:5px;height:5px;border-radius:50%;background:var(--warning)}
.project-card .project-health-dot.is-healthy{background:var(--success)}
.project-card .project-tail{grid-row:1 / 3;grid-column:3;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-end;gap:10px;align-self:start}
.project-card .project-env{font-size:10px;font-weight:600;color:var(--info);background:var(--info-bg);padding:3px 6px;border-radius:4px;white-space:nowrap}
.project-card .project-env:before{content:'●';font-size:7px;margin-right:4px}
.project-card .project-age{font-size:10px;color:var(--muted);white-space:nowrap}
.project-card .project-open{position:absolute;right:15px;bottom:13px;color:var(--primary);display:grid;place-items:center;opacity:.8}
.project-card:hover .project-open{transform:translateX(2px);opacity:1}
.project-card:focus-visible{outline:2px solid var(--focus-ring,var(--primary));outline-offset:2px}
/* Domains — keep settings, DNS status, assignment counts and manage action visible, not stretched. */

.zone-manage.btn:hover:not(:disabled){background:transparent;border-color:transparent;text-decoration:underline;color:var(--primary-hover)}
/* On resource tables narrow screens can scroll horizontally instead of collapsing labels illegibly. */

function sidebar(){return `<aside class="sidebar ${ui.mobileMenu?'open':''}"><div class="brand"><div class="logo">${ico('layers',22)}</div><div><div class="brand-name">cloudlane<span style="color:var(--mint)">.</span></div><div class="brand-tag">INFRASTRUCTURE, SIMPLIFIED</div></div></div><button class="workspace-btn" data-action="workspace"><span class="workspace-ico">${ico('grid',17)}</span><span style="flex:1"><div style="font-size:12px;font-weight:700">${esc(state.workspace)}</div><div class="sm">Personal workspace</div></span>${ico('down',14)}</button><p class="sidebar-label">WORKSPACE</p><nav class="nav-list" aria-label="Main navigation">${nav.map(([id,ic,t])=>`<button class="nav-item ${ui.page===id||((ui.page==='project'||ui.page==='service')&&id==='projects')||(ui.page==='domainDetail'&&id==='domains')?'active':''}" data-action="go" data-page="${id}">${ico(ic,17)}<span>${t}</span>${id==='projects'&&ui.page==='project'?ico('chevron',13,'class="nav-arrow"'):''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="soft-banner" style="padding:11px 12px;gap:9px;background:#22281f;border-color:#474932"><span style="color:#e7d69a">${ico('info',16)}</span><div><div style="color:#e8dbac;font-size:11px;font-weight:750">Prototype mode</div><div style="font-size:10px;color:#b3a57b">No real VPS changes</div></div></div><div class="tiny-profile" style="margin-top:12px"><div class="avatar">DW</div><div><div class="profile-name">Demo Workspace</div><div class="profile-meta">Local browser storage</div></div></div></div></aside>`}
function header(){let title={overview:'Overview',projects:'Projects',servers:'Servers',databases:'Databases',cron:'Cron Jobs',domains:'Domains',email:'Email',activity:'Activity',settings:'Settings',project:project(ui.projectId)?.name||'Project',service:service(ui.serviceId)?.name||'Service',domainDetail:domainZone(ui.domainZoneId)?.name||'Domain'}[ui.page];const p=ui.page==='service'?project(service(ui.serviceId)?.projectId):null;const inDomain=ui.page==='domainDetail';return `<header class="topbar"><button class="icon-btn mobile-toggle" data-action="mobileMenu" aria-label="Open menu">${ico('menu',19)}</button><div class="crumb"><span>Workspace</span>${ico('chevron',12)}${inDomain?`<button class="link" data-action="go" data-page="domains">Domains</button>${ico('chevron',12)}`:''}${p?`<button class="link" data-action="openProject" data-id="${p.id}">${esc(p.name)}</button>${ico('chevron',12)}`:''}<strong>${esc(title)}</strong></div><div class="top-spacer"></div><span class="top-server"><span class="dot"></span> VPS connected (demo)</span><span class="top-pill">${ico('alert',13)} SIMULATION</span></header>`}
function heading(label,title,sub,actions=''){return `<div class="heading"><div><p class="eyebrow">${esc(label)}</p><h1>${esc(title)}</h1><p class="subtitle">${esc(sub)}</p></div><div class="head-actions">${actions}</div></div>`}
function statsCard(ic,num,label,foot){return `<div class="card stat"><div class="stat-row"><div class="stat-icon">${ico(ic,18)}</div><div class="stat-main"><div class="stat-label">${esc(label)}</div><div class="stat-note">${esc(foot)}</div></div><div class="stat-number">${esc(num)}</div></div></div>`}
function projectCard(p){let ss=state.services.filter(s=>s.projectId===p.id),online=ss.filter(s=>['running','active'].includes(s.status)).length;return `<div class="card project-card clickable" data-action="openProject" data-id="${p.id}" role="button" tabindex="0" aria-label="Open ${attr(p.name)} project"><span class="project-mark">${ico('folder',18)}</span><div class="project-copy"><h3>${esc(p.name)}</h3><div class="project-desc">${ss.length} service${ss.length===1?'':'s'} <span class="project-meta-separator">·</span> <span class="project-health"><span class="project-health-dot ${online?'is-healthy':''}"></span>${online} healthy</span></div></div><div class="project-tail"><span class="project-env">production</span><span class="project-age">${esc(age(p.created))}</span></div><span class="project-open" aria-hidden="true">${ico('arrow',15)}</span></div>`}
function activityMarkup(items){return `<div class="activity-list">${items.length?items.map(a=>`<div class="activity-item"><span class="activity-icon">${ico(({deploy:'rocket',database:'database',cron:'clock',domain:'globe',project:'folder',system:'settings'})[a.type]||'pulse',15)}</span><div class="activity-body"><span class="activity-text">${esc(a.title)}</span><span class="activity-detail">${esc(a.detail)}</span><span class="activity-time">${esc(age(a.created))}</span></div></div>`).join(''):`<p class="muted small">No activity yet.</p>`}</div>`}
function healthBlock(){let vals=[['CPU usage',23, '0.23 / 1 vCPU'],['Memory usage',51,'522 MB / 1,024 MB'],['Disk usage',46,'4.6 GB / 10 GB']];return `<div class="metrics">${vals.map(([n,v,t])=>`<div class="metric"><div class="metric-label"><span class="muted">${n}</span><span class="metric-value">${v}%</span></div><div class="progress"><span style="width:${v}%"></span></div><div class="hint">${t} · simulated</div></div>`).join('')}</div>`}
function overview(){let active=state.services.filter(s=>s.kind==='application'&&s.status==='running').length;let db=state.services.filter(s=>s.kind==='database').length;let jobs=state.services.filter(s=>s.kind==='cron').length;return `${heading('YOUR INFRASTRUCTURE','Good morning, builder.','Everything you need to deploy, run and manage your services, in one place.',btn(`${ico('plus',16)} Create new`,'new','btn-primary'))}<div class="grid four">${statsCard('folder',state.projects.length,'Projects','Organized workspaces')}${statsCard('rocket',active,'Live applications','Across all projects')}${statsCard('database',db,'Databases','Provisioned services')}${statsCard('clock',jobs,'Scheduled jobs','Independent workflows')}</div><div class="section-head"><h2 class="section-title">Quick actions</h2></div><div class="grid three"><button class="quicklink" data-action="openModal" data-modal="deploy"><span class="status-icon mint">${ico('rocket',19)}</span><span><div class="q-name">Deploy an application</div><div class="q-desc">From ZIP or GitHub</div></span><span style="margin-left:auto;color:var(--muted)">${ico('chevron',15)}</span></button><button class="quicklink" data-action="openModal" data-modal="database"><span class="status-icon">${ico('database',19)}</span><span><div class="q-name">Create database</div><div class="q-desc">PostgreSQL, MySQL, MariaDB</div></span><span style="margin-left:auto;color:var(--muted)">${ico('chevron',15)}</span></button><button class="quicklink" data-action="openModal" data-modal="cron"><span class="status-icon gold">${ico('clock',19)}</span><span><div class="q-name">Schedule a cron job</div><div class="q-desc">HTTP callbacks or tasks</div></span><span style="margin-left:auto;color:var(--muted)">${ico('chevron',15)}</span></button></div><div class="section-head"><div><h2 class="section-title">Your projects</h2><div class="sub">A unified home for every service</div></div><button class="link" data-action="go" data-page="projects">View all ${ico('arrow',14)}</button></div><div class="grid three">${state.projects.slice(0,3).map(projectCard).join('')}${state.projects.length===0?`<div class="card empty">No projects yet.</div>`:''}</div><div class="section-head"><h2 class="section-title">Operations</h2></div><div class="grid two-wide"><div class="card"><div class="row space"><h3 class="section-title">Server health</h3>${badge('Healthy','ok')}</div><p class="muted small">${esc(state.server.name)} · ${esc(state.server.os)}</p>${healthBlock()}<div class="divider"></div><div class="row space"><span class="xs muted">Starter VPS budget</span><span class="xs strong">1 vCPU · 1 GB RAM · 10 GB disk</span></div><p class="hint" style="margin-top:9px">On a 1 GB VPS, build heavy projects off-server; avoid concurrent builds and databases.</p></div><div class="card"><div class="row space"><h3 class="section-title">Recent activity</h3><button class="link" data-action="go" data-page="activity">All activity</button></div>${activityMarkup(state.activities.slice(0,4))}</div></div>`}
function projectsView(){let term=ui.search.toLowerCase().trim();let ps=state.projects.filter(p=>!term||p.name.toLowerCase().includes(term));return `${heading('WORKSPACE','Projects','Organize applications and infrastructure in environments.',btn(`${ico('plus',15)} New project`,'openModal','btn-primary','data-modal="project"'))}<div class="row space" style="margin-bottom:18px"><div class="search">${ico('search',15)}<input id="projectSearch" placeholder="Search projects..." value="${attr(ui.search)}" aria-label="Search projects" /></div><div class="muted xs">${ps.length} project${ps.length!==1?'s':''}</div></div><div id="projectResults" class="grid three">${ps.map(projectCard).join('')||`<div class="card empty"><h3>No projects found</h3><p>Create a project to get started.</p></div>`}</div>`}
function projectView(){let p=project(ui.projectId);if(!p)return emptyMissing('Project');let ss=state.services.filter(s=>s.projectId===p.id);return `<button class="back" data-action="go" data-page="projects">${ico('back',15)} All projects</button>${heading('PROJECT / PRODUCTION',p.name,`Created ${date(p.created)} · Default environment: production`,btn(`${ico('plus',15)} Add service`,'new','btn-primary',`data-project="${p.id}"`))}<div class="soft-banner">${ico('layers',21)}<div><strong class="small">Production environment</strong><p>Services here share a project and can connect privately when supported.</p></div><div style="margin-left:auto">${badge(`${ss.length} services`,'blue')}</div></div><div class="section-head"><h2 class="section-title">Services</h2></div><div class="card table-frame"><div class="table-wrap"><table class="table"><thead><tr><th>Service</th><th>Type</th><th>Status</th><th>Endpoint / connection</th><th>Actions</th></tr></thead><tbody>${ss.map(s=>`<tr><td class="clickable-cell" data-action="openService" data-id="${s.id}"><div class="row"><span class="status-icon ${s.kind==='database'?'gold':s.kind==='cron'?'purple':'mint'}">${ico(itemIcon(s),16)}</span><div><div class="main-cell">${esc(s.name)}</div><div class="sub-cell">production</div></div></div></td><td>${esc(s.kind==='application'?`${s.framework} · ${cap(s.role)}`:s.kind==='database'?s.engine:'Scheduled HTTP')}</td><td>${statusBadge(s.status)}</td><td class="mono xs">${esc(s.kind==='application'?primaryDomain(s.id):s.kind==='database'?`${s.database} · internal`:s.schedule)}</td><td><button class="btn btn-small" data-action="openService" data-id="${s.id}">Manage ${ico('chevron',12)}</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty"><h3>No services yet</h3><p>Deploy an app, provision a database or create a cron job.</p>${btn('Add first service','new','btn-primary',`data-project="${p.id}"`)}</div></td></tr>`}</tbody></table></div></div>`}
function servicesIndex(kind){let list=state.services.filter(s=>s.kind===kind);const isDb=kind==='database', title=isDb?'Databases':'Cron Jobs',desc=isDb?'Databases for your applications, wherever they run.':'Schedule callbacks and background operations independently of apps.';return `${heading(isDb?'DATA LAYER':'AUTOMATION',title,desc,btn(`${ico('plus',15)} Create ${isDb?'database':'cron job'}`,'openModal','btn-primary',`data-modal="${isDb?'database':'cron'}"`))}<div class="card table-frame"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Project</th><th>${isDb?'Engine / database':'Schedule / target'}</th><th>Status</th><th>Manage</th></tr></thead><tbody>${list.map(s=>`<tr><td><div class="row"><span class="status-icon ${isDb?'gold':'purple'}">${ico(itemIcon(s),16)}</span><div><div class="main-cell">${esc(s.name)}</div><div class="sub-cell">${isDb?esc(s.external?'Restricted external access':'Private network'):esc(s.timezone)}</div></div></div></td><td>${esc(project(s.projectId)?.name||'—')}</td><td><div class="main-cell">${esc(isDb?s.engine:s.schedule)}</div><div class="sub-cell">${esc(isDb?s.database:s.target)}</div></td><td>${statusBadge(s.status)}</td><td><button class="btn btn-small" data-action="openService" data-id="${s.id}">Open ${ico('chevron',13)}</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">${ico(isDb?'database':'clock',28)}<h3>No ${isDb?'databases':'cron jobs'} yet</h3><p>Use Create New to provision your first service.</p></div></td></tr>`}</tbody></table></div></div>`}

function settingsView(){return `${heading('CONFIGURATION','Settings','Manage your workspace and the local prototype.','')}<div class="grid two"><div class="card"><h3 class="section-title">Workspace</h3><p class="muted small">Your current workspace name</p><form id="workspaceForm"><div class="form-row"><label class="form-label" for="workspaceName">Workspace name</label><input id="workspaceName" name="workspace" maxlength="54" value="${attr(state.workspace)}" required></div><button class="btn btn-primary" type="submit">Save changes</button></form></div><div class="card"><h3 class="section-title">GitHub connection</h3><p class="muted small">Connect repositories via a GitHub App in production. This prototype only simulates authorization.</p><div class="row space" style="margin-top:22px"><div class="row">${ico('github',20)}<strong>${state.githubConnected?'Demo account connected':'Not connected'}</strong></div>${btn(state.githubConnected?'Disconnect demo':'Connect demo','toggleGithub',state.githubConnected?'':'btn-primary')}</div></div><div class="card"><h3 class="section-title">Local demo storage</h3><p class="muted small">Your projects and simulated operations are stored only in this browser using localStorage.</p><div class="divider"></div>${btn(`${ico('refresh',15)} Reset sample workspace`,'resetPrompt','btn-danger')}</div><div class="card"><h3 class="section-title">Scope</h3><p class="muted small">ZIP, GitHub, API hosting, database provisioning, cron jobs, domains, deployment logs, rollback, and resource monitoring are represented.</p><div class="divider"></div><div class="pills">${badge('No backend','blue')}${badge('No network calls','blue')}${badge('Mobile distribution: later','warn')}</div></div></div>`}

function createApp(data){let projectId=data.projectId,source=ui.modalData.source||'zip';let filename='';let repo='',branch='main';if(source==='zip'){if(!ui.modalData.fileObj){flash('Choose a ZIP file before deploying.',true);return}filename=ui.modalData.fileName||ui.modalData.fileObj.name}else{repo=String(data.repo||'').trim();branch=String(data.branch||'main').trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){flash('Enter a repository like owner/project.',true);return}if(!state.githubConnected){flash('Connect the GitHub demo account first.',true);return}}let name=String(data.name||'').trim();if(!/^[A-Za-z0-9][A-Za-z0-9_-]{0,47}$/.test(name)){flash('Use a valid application service name.',true);return}let detected=ui.modalData.detected||'Node.js/Express';let framework=data.framework==='auto'?detected:data.framework;let role=framework==='NestJS'||(framework==='Node.js/Express'&&/api|backend|server/i.test([name,repo,filename].join(' ')))?'api':'web';projectId=resolveProjectForService(data);if(!projectId)return;let s={id:uid('svc'),projectId,name,kind:'application',role,framework,source,repo,branch,autoDeploy:source==='github'&&!!data.autoDeploy,fileName:filename,status:'deploying',env:'production',variables:[],created:NOW(),activeDeployment:null};state.services.push(s);if(role!=='worker'){let slug=name.toLowerCase().replace(/[^a-z0-9-]/g,'-');let count=state.domains.filter(d=>d.name.startsWith(`${slug}.`)).length;let nameDomain=`${slug}${count?'-'+s.id.slice(-3):''}.apps.example.test`;state.domains.push({id:uid('dom'),serviceId:s.id,name:nameDomain,status:'active',https:true,type:'platform',created:NOW()})}activity('Deployment requested',`${name} · ${source==='zip'?'ZIP':'GitHub'}`,'deploy');ui.modal=null;startDeployment(s.id);go('service',null,s.id,'deployments');flash('Deployment started. Watch its progress in Deployments.')}

async function inspectZip(file){const MAX=100*1024*1024;if(!file.name.toLowerCase().endsWith('.zip'))throw Error('Choose a .zip archive.');if(file.size>MAX)throw Error('The demo accepts ZIP files up to 100 MB.');const buf=await file.arrayBuffer(),v=new DataView(buf);if(v.byteLength<22)throw Error('Invalid or empty ZIP file.');let eocd=-1;for(let i=v.byteLength-22;i>=Math.max(0,v.byteLength-65557);i--){if(v.getUint32(i,true)===0x06054b50){eocd=i;break}}if(eocd<0)throw Error('Could not read ZIP directory. Ensure this is a valid ZIP file.');let count=v.getUint16(eocd+10,true),offset=v.getUint32(eocd+16,true),names=[];if(count>10000)throw Error('Too many archive entries for the demo.');for(let i=0;i<count;i++){if(offset+46>v.byteLength||v.getUint32(offset,true)!==0x02014b50)throw Error('ZIP central directory is damaged.');let nl=v.getUint16(offset+28,true),el=v.getUint16(offset+30,true),cl=v.getUint16(offset+32,true);if(offset+46+nl>v.byteLength)throw Error('ZIP filename is damaged.');names.push(new TextDecoder().decode(new Uint8Array(buf,offset+46,nl)).replaceAll('\\','/').toLowerCase());offset+=46+nl+el+cl}const has=(needle)=>names.some(n=>n.endsWith(needle));const includes=(str)=>names.some(n=>n.includes(str));let framework=has('nest-cli.json')?'NestJS':has('next.config.js')||has('next.config.mjs')||has('next.config.ts')?'Next.js':has('vite.config.js')||has('vite.config.ts')?'React/Vite':has('dockerfile')?'Dockerfile':has('index.html')&&!has('package.json')?'Static HTML':has('package.json')?'Node.js/Express':has('index.html')?'Static HTML':'Node.js/Express';return {framework,count:names.length}}

if(!state.dnsPreviewVersion){const sample=state.domainZones.find(z=>z.id==='zone_secondary'&&z.status==='pending');if(sample)sample.dnsMode='managed';state.dnsPreviewVersion=1;save()}
const previousModalV18=modalView;
modalView=function modalViewV18(){if(ui.modal!=='dnsModeChange')return previousModalV18();let z=domainZone(ui.modalData.zoneId);if(!z)return '';let target=z.dnsMode==='managed'?'manual':'managed';return `<div class="modal-wrap" data-action="overlayClose"><div class="modal" role="dialog" aria-modal="true" aria-label="Change DNS management"><div class="modal-head"><div><h2>Change DNS management</h2><p>${esc(z.name)}</p></div><button class="icon-btn" data-action="closeModal" aria-label="Close dialog">${ico('close',17)}</button></div><div class="modal-body"><form id="dnsModeChangeForm"><input type="hidden" name="zoneId" value="${attr(z.id)}"><input type="hidden" name="target" value="${target}"><div class="notice">Switching authoritative DNS can interrupt websites and email. Cloudlane will not change registrar settings for you.</div><div class="dns-guide"><div class="dns-step"><span class="dns-step-index">1</span><span class="small">Copy your current A/AAAA, CNAME, MX, SPF, DKIM, DMARC and other DNS records.</span></div><div class="dns-step"><span class="dns-step-index">2</span><span class="small">Review DNSSEC / DS records at your registrar and plan a safe transition.</span></div><div class="dns-step"><span class="dns-step-index">3</span><span class="small">${target==='managed'?'Prepare reliable authoritative nameservers and change registrar delegation only when ready.':'Recreate the zone at your external DNS provider, then change delegation back there.'}</span></div></div><label class="small" style="display:flex;align-items:flex-start;gap:10px;margin:12px 0"><input type="checkbox" name="understand" required style="width:auto;margin-top:3px">I understand this is only a preview and no live DNS is changed.</label><div class="modal-footer" style="margin:20px -24px -24px">${btn('Cancel','closeModal')}<button class="btn btn-primary" type="submit">Prepare ${target==='managed'?'managed':'manual'} DNS</button></div></form></div></div></div>`};
const previousOpenModalV18=openModal;
openModal=function openModalV18(type,extra={}){if(type==='dnsModeChange'){ui.modal=type;ui.modalData={zoneId:extra.zoneId||ui.domainZoneId};render();return;}return previousOpenModalV18(type,extra)};
const previousActionV18=doAction;
doAction=function doActionV18(action,el,event){let id=el.dataset.id;switch(action){
 case 'dnsModeChange':openModal('dnsModeChange',{zoneId:id});return;
 case 'cancelDnsTransition':{let z=domainZone(id);if(!z)return;delete z.pendingDnsMode;activity('DNS mode change cancelled',z.name,'domain');save();render();flash('Pending DNS transition cancelled.');return;}
 case 'copyDnsChecklist':{let z=domainZone(id);if(z)copyText(dnsChecklist(z));return;}
 case 'verifyZoneConfirm':{let z=domainZone(id);if(!z)return;const mode=z.pendingDnsMode||z.dnsMode;if(z.pendingDnsMode){z.dnsMode=z.pendingDnsMode;delete z.pendingDnsMode;}z.status='verified';z.delegation=mode==='managed'?'verified-demo':'external-demo';activity(mode==='managed'?'Nameserver delegation simulated':'Manual DNS verification simulated',z.name,'domain');save();ui.modal=null;go('domainDetail',z.id,null,'overview');flash('DNS verification simulated. No public DNS was changed.');return;}
 }return previousActionV18(action,el,event)};
document.addEventListener('submit',e=>{if(e.target.id!=='dnsModeChangeForm')return;e.preventDefault();if(!e.target.reportValidity())return;let d=formData(e.target),z=domainZone(d.zoneId);if(!z||!['managed','manual'].includes(d.target)||d.target===z.dnsMode)return flash('No change needed.',true);z.pendingDnsMode=d.target;activity('DNS transition prepared (demo)',`${z.name} → ${d.target}`,'domain');save();ui.modal=null;go('domainDetail',z.id,null,'settings');flash('Transition plan saved. Review setup instructions before confirming.');});
const previousSettingsV18=settingsView;
settingsView=function settingsViewV18(){let base=previousSettingsV18();if(ui.settingsTab==='integrations')base=base.replace('DNS providers','DNS management').replace('DNS is managed centrally under Domains. Provider API connections are planned; this demo uses manual records.','Use Manual DNS or Cloudlane Managed DNS per domain. No registrar API integration is required. Managed mode needs independent authoritative DNS infrastructure in production.').replace('Planned integration','Two DNS modes');return base};


// Cloudlane v1.10 — visual appearance configuration, sourced from the uploaded design-system palette matrix.
// The default preserves Cloudlane's dark-first experience, and the palette setting is local to this browser.
const CLOUDLANE_APPEARANCE_KEY='cloudlane-appearance-v110';
const CLOUDLANE_PALETTES=[['original','Original · Teal / Slate'],['slate','Slate & Charcoal'],['sand','Sand & Saddle'],['sage','Sage & Burgundy'],['mauve','Mauve Meadow']];
function readCloudlaneAppearance(){try{const x=JSON.parse(localStorage.getItem(CLOUDLANE_APPEARANCE_KEY)||'{}');return {palette:CLOUDLANE_PALETTES.some(p=>p[0]===x.palette)?x.palette:'original',mode:x.mode==='light'?'light':'dark'}}catch(_){return {palette:'original',mode:'dark'}}}
let cloudlaneAppearance=readCloudlaneAppearance();
function applyCloudlaneAppearance(){document.documentElement.dataset.palette=cloudlaneAppearance.palette;document.documentElement.classList.toggle('dark',cloudlaneAppearance.mode==='dark');document.documentElement.style.colorScheme=cloudlaneAppearance.mode}
function chooseCloudlaneAppearance(patch){cloudlaneAppearance={...cloudlaneAppearance,...patch};try{localStorage.setItem(CLOUDLANE_APPEARANCE_KEY,JSON.stringify(cloudlaneAppearance))}catch(_){}applyCloudlaneAppearance();render()}
function appearancePanel(){return `<section class="card design-pref-panel" aria-label="Appearance preferences"><div class="design-pref-header"><div><h3 class="section-title">Appearance</h3><p class="design-intro">Colors, typography, and control styling follow the uploaded design system. Cloudlane workflows remain unchanged.</p></div>${badge('Visual preference','blue')}</div><div class="design-pref-group">Appearance mode</div><div class="design-mode-group" role="group" aria-label="Color mode">${[['light','Light'],['dark','Dark']].map(([mode,label])=>`<button type="button" data-action="designMode" data-mode="${mode}" aria-pressed="${cloudlaneAppearance.mode===mode}">${label}</button>`).join('')}</div><div class="design-pref-group">Color palette</div><div class="design-palette-grid" role="group" aria-label="Color palette">${CLOUDLANE_PALETTES.map(([id,label])=>`<button type="button" class="design-palette-choice" data-action="designPalette" data-palette="${id}" aria-pressed="${cloudlaneAppearance.palette===id}"><span class="design-swatch ${id}" aria-hidden="true"></span><strong>${label}</strong></button>`).join('')}</div><p class="hint" style="margin-top:15px">This setting changes only how your local Cloudlane prototype looks. It does not affect projects, deployments, or DNS.</p></section>`}
const previousSettingsForVisualSystem=settingsView;
settingsView=function settingsViewV110(){const markup=previousSettingsForVisualSystem();if(ui.settingsTab!=='preferences')return markup;return markup.replace('<div class="setting-grid">',appearancePanel()+'<div class="setting-grid">')};
const previousActionForVisualSystem=doAction;
doAction=function doActionV110(action,el,event){if(action==='designPalette'){const palette=el.dataset.palette;if(CLOUDLANE_PALETTES.some(p=>p[0]===palette))chooseCloudlaneAppearance({palette});return}if(action==='designMode'){const mode=el.dataset.mode;if(mode==='dark'||mode==='light')chooseCloudlaneAppearance({mode});return}return previousActionForVisualSystem(action,el,event)};
applyCloudlaneAppearance();


/* Cloudlane v1.12 — Assistant launcher position follows navigation, touch and mouse. */
const CLOUDLANE_ASSISTANT_POS_KEY='cloudlane-assistant-position-v112';
let cloudlaneAssistantSavedPosition=null;
try { const raw=localStorage.getItem(CLOUDLANE_ASSISTANT_POS_KEY); if(raw) { const point=JSON.parse(raw); if(Number.isFinite(point.x)&&Number.isFinite(point.y))cloudlaneAssistantSavedPosition=point; } } catch (_) {}
function cloudlaneClampAssistant(n,min,max){return Math.min(Math.max(n,min),Math.max(min,max));}
function cloudlanePlaceAssistant(){
  const fab=document.querySelector('.ai-fab');
  if(!fab)return;
  fab.innerHTML=ico('sparkles',18);
  fab.title='Drag to move · Tap to open Cloudlane Assistant';
  fab.setAttribute('aria-label','Open Cloudlane Assistant (drag to reposition)');
  fab.setAttribute('aria-haspopup','dialog');
  if(cloudlaneAssistantSavedPosition){
    const rect=fab.getBoundingClientRect(),margin=10;
    const rx=Math.max(0,innerWidth-rect.width-margin*2),ry=Math.max(0,innerHeight-rect.height-margin*2);
    const x=cloudlaneClampAssistant(margin+cloudlaneAssistantSavedPosition.x*rx,margin,innerWidth-rect.width-margin);
    const y=cloudlaneClampAssistant(margin+cloudlaneAssistantSavedPosition.y*ry,margin,innerHeight-rect.height-margin);
    fab.style.left=x+'px';fab.style.top=y+'px';fab.style.right='auto';fab.style.bottom='auto';
  }
}
const cloudlanePreviousRenderV112=render;
render=function renderV112(){cloudlanePreviousRenderV112();cloudlanePlaceAssistant();};
let cloudlaneFabDrag=null;
let cloudlaneIgnoreFabClick=false;
document.addEventListener('pointerdown',e=>{
  const fab=e.target.closest('.ai-fab');
  if(!fab||!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;
  const r=fab.getBoundingClientRect();
  cloudlaneFabDrag={fab,id:e.pointerId,originX:e.clientX,originY:e.clientY,x:r.left,y:r.top,moved:false};
  try{fab.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  const d=cloudlaneFabDrag;
  if(!d||d.id!==e.pointerId)return;
  const dx=e.clientX-d.originX,dy=e.clientY-d.originY;
  if(!d.moved&&Math.hypot(dx,dy)<5)return;
  d.moved=true;
  const margin=10;
  const r=d.fab.getBoundingClientRect();
  const x=cloudlaneClampAssistant(d.x+dx,margin,innerWidth-r.width-margin);
  const y=cloudlaneClampAssistant(d.y+dy,margin,innerHeight-r.height-margin);
  d.fab.style.left=x+'px';d.fab.style.top=y+'px';d.fab.style.right='auto';d.fab.style.bottom='auto';
  e.preventDefault();
},{passive:false});
function cloudlaneEndFabDrag(e){
  const d=cloudlaneFabDrag;
  if(!d||d.id!==e.pointerId)return;
  cloudlaneFabDrag=null;
  try { if(d.fab.hasPointerCapture(e.pointerId))d.fab.releasePointerCapture(e.pointerId); } catch(_){}
  if(!d.moved)return;
  const r=d.fab.getBoundingClientRect(),margin=10;
  const rx=Math.max(1,innerWidth-r.width-margin*2),ry=Math.max(1,innerHeight-r.height-margin*2);
  cloudlaneAssistantSavedPosition={x:cloudlaneClampAssistant((r.left-margin)/rx,0,1),y:cloudlaneClampAssistant((r.top-margin)/ry,0,1)};
  try{localStorage.setItem(CLOUDLANE_ASSISTANT_POS_KEY,JSON.stringify(cloudlaneAssistantSavedPosition))}catch(_){}
  cloudlaneIgnoreFabClick=true;
  setTimeout(()=>{cloudlaneIgnoreFabClick=false},320);
}
document.addEventListener('pointerup',cloudlaneEndFabDrag);
document.addEventListener('pointercancel',cloudlaneEndFabDrag);
document.addEventListener('click',e=>{
  if(!cloudlaneIgnoreFabClick||!e.target.closest('.ai-fab'))return;
  cloudlaneIgnoreFabClick=false;
  e.preventDefault();e.stopImmediatePropagation();
},true);
window.addEventListener('resize',cloudlanePlaceAssistant);

render();
</script>
</body>
</html>
