name: Cloudlane CI
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudlane-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  progress:
    name: Progress gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate committed task checkpoints
        run: node scripts/ci-progress.mjs
  verify:
    name: Build and unit tests
    needs: progress
    outputs:
      fixture_artifact_id: ${{ steps.static_fixtures.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Check types, boundaries, contracts and CI configuration
        run: node scripts/ci-step.mjs checks npm run check
      - name: Check formatting
        run: node scripts/ci-step.mjs formatting npm run lint
      - name: Run unit and HTTP integration tests
        run: node scripts/ci-step.mjs unit npm run test:ci
      - name: Build production and explicit demo fixtures
        run: node scripts/ci-step.mjs static-builds npm run test:e2e:prepare
      - name: Discover desktop and mobile browser cases
        run: node scripts/ci-step.mjs browser-discovery npm run test:e2e:list
      - name: Record verification evidence
        if: ${{ always() }}
        run: node scripts/ci-evidence.mjs verify
      - name: Upload unit and build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_attempt }}
          path: |
            test-results/ci/
            test-results/unit/
            test-results/manifests/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - name: Upload static browser fixtures
        id: static_fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-static-${{ github.run_attempt }}
          path: test-results/e2e-site/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
  postgres:
    name: PostgreSQL integration tests
    needs: progress
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
        env:
          POSTGRES_USER: cloudlane_test
          POSTGRES_PASSWORD: cloudlane_test_only
          POSTGRES_DB: cloudlane_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudlane_test -d cloudlane_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build:api
      - name: Run real PostgreSQL migration and constraint tests
        env:
          CLOUDLANE_POSTGRES_TESTS: '1'
          CLOUDLANE_TEST_DATABASE_URL: postgresql://cloudlane_test:cloudlane_test_only@127.0.0.1:5432/cloudlane_ci
        run: node scripts/ci-step.mjs postgres npm run test:postgres
      - name: Record database evidence
        if: ${{ always() }}
        run: node scripts/ci-evidence.mjs postgres
      - name: Upload PostgreSQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-${{ github.run_attempt }}
          path: |
            test-results/ci/
            test-results/postgres/
            test-results/manifests/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
  installer:
    name: Installer preflight and release verification
    needs: progress
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: installer/.go-version
          cache: false
      - name: Run read-only installer tests, race detector, vet and reproducible build
        run: node scripts/ci-step.mjs installer npm run test:installer
      - name: Record installer evidence
        if: ${{ always() }}
        run: node scripts/ci-evidence.mjs installer
      - name: Upload installer diagnostics and development binary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ github.run_attempt }}
          path: |
            test-results/ci/
            test-results/installer/
            test-results/manifests/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
  e2e:
    name: Browser tests (${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build:api
      - name: Require the verified fixture artifact ID
        env:
          FIXTURE_ARTIFACT_ID: ${{ needs.verify.outputs.fixture_artifact_id }}
        run: test -n "$FIXTURE_ARTIFACT_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.fixture_artifact_id }}
          merge-multiple: true
          path: test-results/e2e-site/
      - name: Install pinned Chromium and CI system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser cases
        env:
          E2E_PROJECT: ${{ matrix.project }}
        run: node scripts/ci-step.mjs browser npm run test:e2e:ci -- --project "$E2E_PROJECT"
      - name: Require actual browser evidence
        env:
          E2E_PROJECT: ${{ matrix.project }}
        run: node scripts/browser-evidence.mjs "$E2E_PROJECT"
      - name: Record browser evidence
        if: ${{ always() }}
        env:
          E2E_PROJECT: ${{ matrix.project }}
        run: node scripts/ci-evidence.mjs "$E2E_PROJECT"
      - name: Upload browser reports, screenshots and failure traces
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            test-results/ci/
            test-results/e2e/
            test-results/manifests/
            playwright-report/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [progress, verify, postgres, installer, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject failed, cancelled or skipped prerequisite jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-required.mjs
